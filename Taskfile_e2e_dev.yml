version: '3'

# ---------------------------------------------------------------------------
# E2E tests against the metahub-dev k8s deployment
#
# Usage:
#   task e2e:dev:health              # health check
#   task e2e:dev:conformance         # OCI v1.1.1 conformance suite
#   task e2e:dev:push-multiarch      # push amd64 + arm64 alpine
#   task e2e:dev:verify-index        # verify aggregated index
#   task e2e:dev:referrers           # push artifact with Subject, verify referrers
#   task e2e:dev:tags                # verify tag listing
#   task e2e:dev:all                 # full orchestration
#
# Configuration via env vars (or .env file):
#   METAHUB_DEV_URL   — default: http://metahub.dev.example.com
#   E2E_USERNAME      — default: oci
#   E2E_PASSWORD      — default: oci
# ---------------------------------------------------------------------------

vars:
  METAHUB_DEV_URL: '{{.METAHUB_DEV_URL | default "http://metahub.dev.example.com"}}'
  E2E_USERNAME: '{{.E2E_USERNAME | default "oci"}}'
  E2E_PASSWORD: '{{.E2E_PASSWORD | default "oci"}}'
  E2E_NS_PREFIX: 'e2e-task'
  CONFORMANCE_BIN: '{{.CONFORMANCE_BIN | default "results/distribution-spec/conformance/conformance.test"}}'

tasks:
  # ---------------------------------------------------------------------------
  # e2e:dev:health — verify metahub-dev is reachable
  # ---------------------------------------------------------------------------
  dev:health:
    desc: "Health check against metahub-dev"
    cmds:
      - |
        status=$(curl -s -o /dev/null -w "%{http_code}" "{{.METAHUB_DEV_URL}}/health" 2>/dev/null)
        if [ "${status}" = "200" ]; then
          echo "✓ metahub-dev is healthy (HTTP ${status})"
        else
          echo "✗ metahub-dev returned HTTP ${status}"
          exit 1
        fi

  # ---------------------------------------------------------------------------
  # e2e:dev:conformance — run OCI v1.1.1 conformance suite
  # ---------------------------------------------------------------------------
  dev:conformance:
    desc: "Run OCI v1.1.1 conformance against metahub-dev"
    deps: [dev:health]
    vars:
      OCI_NS: 'e2e/conformance-{{now | date "20060102-150405"}}'
    env:
      OCI_ROOT_URL: '{{.METAHUB_DEV_URL}}'
      OCI_NAMESPACE: '{{.OCI_NS}}'
      OCI_CROSSMOUNT_NAMESPACE: 'e2e/xmount-{{now | date "20060102-150405"}}'
      OCI_USERNAME: '{{.E2E_USERNAME}}'
      OCI_PASSWORD: '{{.E2E_PASSWORD}}'
      OCI_TEST_PULL: '1'
      OCI_TEST_PUSH: '1'
      OCI_TEST_CONTENT_DISCOVERY: '1'
      OCI_TEST_CONTENT_MANAGEMENT: '1'
      OCI_HIDE_SKIPPED_WORKFLOWS: '0'
      OCI_DEBUG: 'false'
      OCI_DELETE_MANIFEST_BEFORE_BLOBS: '0'
    preconditions:
      - sh: 'test -x "{{.CONFORMANCE_BIN}}"'
        msg: "Conformance binary not found at {{.CONFORMANCE_BIN}}. Build it first with: task ociBuild"
    cmds:
      - echo "Running OCI conformance against {{.METAHUB_DEV_URL}} (namespace {{.OCI_NS}})..."
      - '{{.CONFORMANCE_BIN}} -test.v'

  # ---------------------------------------------------------------------------
  # e2e:dev:push-multiarch — push amd64 + arm64 alpine images
  # ---------------------------------------------------------------------------
  dev:push-multiarch:
    desc: "Push multi-arch alpine images to metahub-dev"
    deps: [dev:health]
    vars:
      REGISTRY_HOST:
        sh: echo "{{.METAHUB_DEV_URL}}" | sed 's|http://||;s|https://||;s|/.*||'
      ALPINE_TAG: 'e2e-{{now | date "20060102-150405"}}'
      E2E_REPO: '{{.E2E_NS_PREFIX}}/alpine'
    preconditions:
      - sh: command -v regctl
        msg: "regctl is required. Install from https://github.com/regclient/regclient"
    cmds:
      - regctl registry set "{{.REGISTRY_HOST}}" --tls disabled 2>/dev/null || true
      - regctl registry login "{{.REGISTRY_HOST}}" -u "{{.E2E_USERNAME}}" -p "{{.E2E_PASSWORD}}"
      - echo "Pushing amd64 alpine to {{.REGISTRY_HOST}}/{{.E2E_REPO}}:{{.ALPINE_TAG}}..."
      - regctl image copy --platform linux/amd64 alpine:3.21 "{{.REGISTRY_HOST}}/{{.E2E_REPO}}:{{.ALPINE_TAG}}"
      - echo "Pushing arm64 alpine to {{.REGISTRY_HOST}}/{{.E2E_REPO}}:{{.ALPINE_TAG}}..."
      - regctl image copy --platform linux/arm64 alpine:3.21 "{{.REGISTRY_HOST}}/{{.E2E_REPO}}:{{.ALPINE_TAG}}"
      - echo "✓ Pushed amd64 + arm64 alpine as {{.E2E_REPO}}:{{.ALPINE_TAG}}"
      # Save tag for downstream tasks
      - echo "{{.ALPINE_TAG}}" > /tmp/e2e-dev-alpine-tag.txt

  # ---------------------------------------------------------------------------
  # e2e:dev:verify-index — verify aggregated index
  # ---------------------------------------------------------------------------
  dev:verify-index:
    desc: "Verify the aggregated index has 2 descriptors"
    vars:
      ALPINE_TAG:
        sh: cat /tmp/e2e-dev-alpine-tag.txt 2>/dev/null || echo "latest"
      E2E_REPO: '{{.E2E_NS_PREFIX}}/alpine'
    cmds:
      - |
        TOKEN=$(curl -sf "{{.METAHUB_DEV_URL}}/auth" -u "{{.E2E_USERNAME}}:{{.E2E_PASSWORD}}" | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
        INDEX=$(curl -sf "{{.METAHUB_DEV_URL}}/v2/{{.E2E_REPO}}/manifests/{{.ALPINE_TAG}}" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json")
        
        COUNT=$(echo "${INDEX}" | python3 -c "import json,sys; print(len(json.load(sys.stdin).get('manifests',[])))")
        ARCHS=$(echo "${INDEX}" | python3 -c "
        import json,sys
        d = json.load(sys.stdin)
        print(' '.join(sorted(m.get('platform',{}).get('architecture','?') for m in d.get('manifests',[]))))")
        
        echo "Index descriptors: ${COUNT}, architectures: ${ARCHS}"
        if [ "${COUNT}" = "2" ] && [ "${ARCHS}" = "amd64 arm64" ]; then
          echo "✓ Index verified: 2 descriptors (amd64 + arm64)"
        else
          echo "✗ Expected 2 descriptors (amd64 arm64), got ${COUNT} (${ARCHS})"
          exit 1
        fi

  # ---------------------------------------------------------------------------
  # e2e:dev:referrers — push artifact with Subject, verify referrers API
  # ---------------------------------------------------------------------------
  dev:referrers:
    desc: "Push OCI artifact with Subject and verify referrers API"
    deps: [dev:health]
    cmds:
      - |
        URL="{{.METAHUB_DEV_URL}}"
        TOKEN=$(curl -sf "${URL}/auth" -u "{{.E2E_USERNAME}}:{{.E2E_PASSWORD}}" | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
        REPO="{{.E2E_NS_PREFIX}}/referrers-test"

        # Push config blob
        CONFIG='{"architecture":"amd64","os":"linux"}'
        CONFIG_DIGEST="sha256:$(echo -n "${CONFIG}" | sha256sum | cut -d' ' -f1)"
        CONFIG_SIZE=${#CONFIG}

        UPLOAD_LOC=$(curl -sf -X POST "${URL}/v2/${REPO}/blobs/uploads/" \
            -H "Authorization: Bearer ${TOKEN}" -D - -o /dev/null | grep -i "^location:" | tr -d '\r' | awk '{print $2}')
        if echo "${UPLOAD_LOC}" | grep -q "^/"; then UPLOAD_LOC="${URL}${UPLOAD_LOC}"; fi
        SEP="&"; echo "${UPLOAD_LOC}" | grep -q '?' || SEP="?"
        curl -sf -X PUT "${UPLOAD_LOC}${SEP}digest=${CONFIG_DIGEST}" \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/octet-stream" \
            --data-binary "${CONFIG}" -o /dev/null

        # Push base manifest
        BASE_MANIFEST="{\"schemaVersion\":2,\"mediaType\":\"application/vnd.oci.image.manifest.v1+json\",\"config\":{\"mediaType\":\"application/vnd.oci.image.config.v1+json\",\"digest\":\"${CONFIG_DIGEST}\",\"size\":${CONFIG_SIZE}},\"layers\":[]}"
        BASE_DIGEST="sha256:$(echo -n "${BASE_MANIFEST}" | sha256sum | cut -d' ' -f1)"
        curl -sf -X PUT "${URL}/v2/${REPO}/manifests/base-ref" \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/vnd.oci.image.manifest.v1+json" \
            --data-binary "${BASE_MANIFEST}" -o /dev/null

        # Push empty config for referrer
        EMPTY="{}"
        EMPTY_DIGEST="sha256:$(echo -n "${EMPTY}" | sha256sum | cut -d' ' -f1)"
        EMP_LOC=$(curl -sf -X POST "${URL}/v2/${REPO}/blobs/uploads/" \
            -H "Authorization: Bearer ${TOKEN}" -D - -o /dev/null | grep -i "^location:" | tr -d '\r' | awk '{print $2}')
        if echo "${EMP_LOC}" | grep -q "^/"; then EMP_LOC="${URL}${EMP_LOC}"; fi
        SEP="&"; echo "${EMP_LOC}" | grep -q '?' || SEP="?"
        curl -sf -X PUT "${EMP_LOC}${SEP}digest=${EMPTY_DIGEST}" \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/octet-stream" \
            --data-binary "${EMPTY}" -o /dev/null

        # Push referrer manifest
        BASE_SIZE=${#BASE_MANIFEST}
        REF_MANIFEST="{\"schemaVersion\":2,\"mediaType\":\"application/vnd.oci.image.manifest.v1+json\",\"artifactType\":\"application/vnd.example.e2e.v1\",\"config\":{\"mediaType\":\"application/vnd.oci.empty.v1+json\",\"digest\":\"${EMPTY_DIGEST}\",\"size\":2},\"layers\":[],\"subject\":{\"mediaType\":\"application/vnd.oci.image.manifest.v1+json\",\"digest\":\"${BASE_DIGEST}\",\"size\":${BASE_SIZE}}}"
        REF_DIGEST="sha256:$(echo -n "${REF_MANIFEST}" | sha256sum | cut -d' ' -f1)"
        curl -sf -X PUT "${URL}/v2/${REPO}/manifests/${REF_DIGEST}" \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/vnd.oci.image.manifest.v1+json" \
            --data-binary "${REF_MANIFEST}" -o /dev/null

        # Query referrers
        REFS=$(curl -sf "${URL}/v2/${REPO}/referrers/${BASE_DIGEST}" \
            -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.oci.image.index.v1+json")
        REF_COUNT=$(echo "${REFS}" | python3 -c "import json,sys; print(len(json.load(sys.stdin).get('manifests',[])))")

        if [ "${REF_COUNT}" -ge "1" ]; then
          echo "✓ Referrers API returned ${REF_COUNT} referrer(s)"
        else
          echo "✗ Referrers API returned 0 referrers"
          exit 1
        fi

  # ---------------------------------------------------------------------------
  # e2e:dev:tags — verify tag listing
  # ---------------------------------------------------------------------------
  dev:tags:
    desc: "Verify tag listing on metahub-dev"
    cmds:
      - |
        URL="{{.METAHUB_DEV_URL}}"
        TOKEN=$(curl -sf "${URL}/auth" -u "{{.E2E_USERNAME}}:{{.E2E_PASSWORD}}" | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
        REPO="{{.E2E_NS_PREFIX}}/referrers-test"

        TAGS=$(curl -sf "${URL}/v2/${REPO}/tags/list" -H "Authorization: Bearer ${TOKEN}")
        TAG_COUNT=$(echo "${TAGS}" | python3 -c "import json,sys; print(len(json.load(sys.stdin).get('tags',[])))")

        if [ "${TAG_COUNT}" -ge "1" ]; then
          echo "✓ Tag listing returned ${TAG_COUNT} tag(s)"
        else
          echo "✗ Tag listing returned 0 tags"
          exit 1
        fi

  # ---------------------------------------------------------------------------
  # e2e:dev:all — full E2E orchestration
  # ---------------------------------------------------------------------------
  dev:all:
    desc: "Run all E2E tests against metahub-dev"
    cmds:
      - task: dev:health
      - task: dev:conformance
      - task: dev:push-multiarch
      - task: dev:verify-index
      - task: dev:referrers
      - task: dev:tags
      - echo ""
      - echo "=== All E2E tests passed ==="
