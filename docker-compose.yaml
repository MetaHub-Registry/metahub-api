version: '3'

services:
  dev:
    build: 
      context: .
      target: dev
    environment:
      - SQLITE_FILE=/go/metahub-api/misc/sqlite/metahub_20221017.db
      - PATH=/go/metahub:/go/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - 8080:80
    volumes:
      - .:/go/metahub-api
    networks:
      - api-internal
      - mh-data
    working_dir: /go/metahub-api
    command: ["sleep", "inf"]
  dind:
    build: misc/docker/dind/
    privileged: true
    volumes:
      - .:/go/metahub
    networks:
     - api-internal
     - mh-data
    environment:
      DEV_URL: dev:80
      CE_URL: ce:80
      PS1: 'dind > '
  #  start mailhog
  mailhog:
    image: 'mailhog/mailhog:latest'
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - api-internal
    restart: always

networks:
  api-internal:
  mh-data:
    external: true