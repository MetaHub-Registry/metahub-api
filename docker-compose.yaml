
services:
  dev:
    build: 
      context: .
      target: dev
      ssh:
        - default
    #image: registry.github.com/metahub-registry/metahub-api:2023-03-01-arm64-dev
    environment:
      - SQLITE_FILE=./misc/sqlite/metahub_20251209.db
      - PATH=/go/metahub-api:/go/metahub-core/misc/bin:/go/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - 8080:80
    volumes:
      - goMod:/go/pkg/mod
      - ../community-edition:/community-edition
      - ../metahub-core:/go/metahub-core
      - ../metahub-admin:/go/metahub-admin
      - ./:/go/metahub-api
    networks:
      - api-internal
      - mh-data
    working_dir: /go/metahub-api
    #command: ["sleep", "inf"]
  dind:
    build: misc/docker/dind/
    privileged: true
    restart: always
    volumes:
      - .:/go/metahub
      - ./misc/docker/dind/daemon.json:/etc/docker/daemon.json:ro
      - ../metahub-core:/go/metahub-core
    networks:
     - api-internal
     - mh-data
    environment:
      PATH: /go/metahub-core/misc/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      DEV_URL: dev:80
      CE_URL: ce:80
      PS1: 'dind > '
      MH_USER: qnib
  metahub-ui:
    image: metahub-ui
    ports:
      - "8082:80"
    environment:
      - METAHUB_API_URL=http://localhost:8080
  oci:
    build: misc/docker/oci/
    command: ["sleep", "inf"]
    volumes:
      - ./results:/opt/results
    networks:
     - api-internal
     - mh-data
    environment:
      OCI_ROOT_URL: "http://dev:80"
      OCI_NAMESPACE: "oci/conformance"
      OCI_CROSSMOUNT_NAMESPACE: "oci/conformance"
      OCI_USERNAME: "oci"
      OCI_PASSWORD:  "oci"
      OCI_TEST_PULL: 1
      OCI_TEST_PUSH: 0
      OCI_TEST_CONTENT_DISCOVERY: 0
      OCI_TEST_CONTENT_MANAGEMENT: 0
      OCI_HIDE_SKIPPED_WORKFLOWS: 0
      OCI_DEBUG: 0
      OCI_DELETE_MANIFEST_BEFORE_BLOBS: 0
  #  start mailhog
  #mailhog:
  #  image: 'mailhog/mailhog:latest'
  #  ports:
  #    - "1025:1025"
  #    - "8025:8025"
  #  networks:
  #    - api-internal
  #  restart: always

networks:
  api-internal:
  mh-data:
    external: true

volumes:
  goMod: