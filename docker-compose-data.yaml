  minio:
    # MinIO stopped anonymous pulls from quay.io (the registry answers 401)
    # and removed the minio/minio images from Docker Hub, so a fresh clone
    # could no longer start the stack. pgsty/minio is a maintained build of
    # upstream MinIO with the same entrypoint and the same /minio layout;
    # pinned by digest so the quickstart does not move under a visitor.
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    ports:
      - 9000:9000
      - 9001:9001
    networks:
      - mh-data
    volumes:
      #- ${PWD}/misc/minio:/minio
      - /minio
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?run misc/bin/gen-compose-config.sh}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?run misc/bin/gen-compose-config.sh}"
    command: ["server", "/minio", "--console-address=0.0.0.0:9001"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 60s
  #backup:
  #  image: alpine:3.16.2
  #  volumes:
  #    - ${PWD}/misc/minio:/minio
  #    - ${PWD}/misc/backup:/backup
  #  command: ["sleep", "inf"]
  neo4j:
    image: neo4j:2026.03.1
    ports:
      - 7474:7474
      - 7687:7687
    networks:
      - mh-data
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?run misc/bin/gen-compose-config.sh}"
      NEO4J_PLUGINS: '["graph-data-science","apoc"]'
    volumes:
     - neo4j:/var/lib/neo4j/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:?run misc/bin/gen-compose-config.sh}", "RETURN 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s
  registry:
    image: registry:2.8.1
    ports:
      - 5050:5050
    networks:
      - mh-data
    volumes:
      - ce-registry:/opt/registry
    environment: 
      - REGISTRY_HTTP_ADDR=0.0.0.0:5050 
      - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/opt/registry

volumes:
  neo4j:
  # ce-registry volume is external so that it sticks around after the stack is removed
  ce-registry:
    external: true

networks:
  api-internal:
  mh-data:
    external: true
