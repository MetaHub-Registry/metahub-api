  rustfs:
    # Apache-2.0 object store, officially published and anonymously pullable.
    # The MinIO images are no longer an option: quay.io answers 401 for
    # anonymous pulls and the Docker Hub images were removed. Pinned by digest
    # so the quickstart does not move under a visitor.
    image: rustfs/rustfs@sha256:69bd3c4d8d79b74723bfd68c9fbd9085155d4d4b44a5a136d87502f3075cc68c
    ports:
      - 9000:9000
      - 9001:9001
    networks:
      - mh-data
    volumes:
      - rustfs-data:/data
    environment:
      RUSTFS_ACCESS_KEY: "${MINIO_ROOT_USER:?run misc/bin/gen-compose-config.sh}"
      RUSTFS_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?run misc/bin/gen-compose-config.sh}"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    command: ["/data"]
    healthcheck:
      # RustFS serves /health, not MinIO's /minio/health/live.
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/health"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s
  #backup:
  #  image: alpine:3.16.2
  #  volumes:
  #    - ${PWD}/misc/minio:/minio
  #    - ${PWD}/misc/backup:/backup
  #  command: ["sleep", "inf"]
  neo4j:
    image: neo4j:2026.03.1
    ports:
      - 7474:7474
      - 7687:7687
    networks:
      - mh-data
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?run misc/bin/gen-compose-config.sh}"
      NEO4J_PLUGINS: '["graph-data-science","apoc"]'
    volumes:
     - neo4j:/var/lib/neo4j/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:?run misc/bin/gen-compose-config.sh}", "RETURN 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s
  registry:
    image: registry:2.8.1
    ports:
      - 5050:5050
    networks:
      - mh-data
    volumes:
      - ce-registry:/opt/registry
    environment: 
      - REGISTRY_HTTP_ADDR=0.0.0.0:5050 
      - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/opt/registry

volumes:
  neo4j:
  rustfs-data:
  # ce-registry volume is external so that it sticks around after the stack is removed
  ce-registry:
    external: true

networks:
  api-internal:
  mh-data:
    external: true
