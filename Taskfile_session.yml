version: '3'

# ---------------------------------------------------------------------------
# Session management — create / iterate / finalize / suspend / resume
#
# Usage:
#   task session:new     -- <description>           # start a session
#   task session:dev     -- <description>            # iterate dev version
#   task session:finish  -- <description>            # finalize all repos
#   task session:version:<repo>:<level> -- <desc>    # set release version
#   task session:close:<repo>           -- <desc>    # close MR (no changes)
#   task session:suspend -- <description>            # remove worktrees
#   task session:resume  -- <description>            # recreate worktrees
#   task session:list                                # list active sessions
#
# Workflow:
#
#   1. START
#      task session:new -- add-oauth-support
#        → branches all repos, bumps to X.Y.Z-dev1, pushes, draft MRs
#
#   2. WORK (repeat)
#      OpenSpec propose/apply/explore in each worktree
#      After each change: tests + sonar run automatically
#      task session:dev -- add-oauth-support   (optional dev iteration)
#
#   3. FINISH
#      task session:finish -- add-oauth-support
#        → per repo: archive OpenSpec changes, run tests, sonar, push
#        → updates each MR with a summary comment
#        → human reviews and merges
#
#   4. VERSION (per repo, after finish)
#      task session:version:metalib:minor -- add-oauth-support
#      task session:version:metahub-api:patch -- add-oauth-support
#      task session:close:metahub-admin -- add-oauth-support
#      task session:close:metahub-ui -- add-oauth-support
#
# The human does the actual merge.
#
# Version philosophy:
#   The semver level (major/minor/patch) is decided at session END,
#   per-repo, based on actual changes — not guessed at the start.
#   During the session, versions use -devN on the CURRENT base version.
# ---------------------------------------------------------------------------

vars:
  SESSION_DIR: sessions
  DEV_STACK_DIR: ~/src/gitlab.com/qnib-ansible/dev-stack
  REPO_API_DIR: "."
  REPO_LIB_DIR: "../metahub-core"
  REPO_ADMIN_DIR: "../metahub-admin"
  REPO_UI_DIR: "~/src/gitlab.com/qnib-frontend/metahub-ui"
  REPO_CE_DIR: "~/src/gitlab.com/qnib-metahub/community-edition"

tasks:
  # ===========================================================================
  # session:new — start a session
  # ===========================================================================
  new:
    desc: "Create a session: task session:new -- <description>"
    requires:
      vars: [CLI_ARGS]
    vars:
      DESC: "{{.CLI_ARGS}}"
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: "Usage: task session:new -- <description>"
      - sh: 'echo "{{.CLI_ARGS}}" | grep -qE "^[a-z0-9][a-z0-9-]*[a-z0-9]$"'
        msg: "Description must be kebab-case (lowercase, hyphens, no leading/trailing hyphen)"
      - sh: '[ ! -d "{{.SESSION_DIR}}/{{.CLI_ARGS}}" ]'
        msg: "Session directory '{{.SESSION_DIR}}/{{.CLI_ARGS}}' already exists"
      - sh: 'command -v glab >/dev/null 2>&1'
        msg: "glab CLI is required but not found"
      - sh: 'command -v bump2version >/dev/null 2>&1'
        msg: "bump2version is required but not found"
    cmds:
      - mkdir -p "{{.SESSION_DIR}}/{{.DESC}}"
      - task: _branch-and-mr
        vars: { DESC: "{{.DESC}}", REPO_NAME: "metahub-api", REPO_DIR: "{{.REPO_API_DIR}}" }
      - task: _branch-and-mr
        vars: { DESC: "{{.DESC}}", REPO_NAME: "metalib", REPO_DIR: "{{.REPO_LIB_DIR}}" }
      - task: _branch-and-mr
        vars: { DESC: "{{.DESC}}", REPO_NAME: "metahub-admin", REPO_DIR: "{{.REPO_ADMIN_DIR}}" }
      - task: _branch-and-mr
        vars: { DESC: "{{.DESC}}", REPO_NAME: "metahub-ui", REPO_DIR: "{{.REPO_UI_DIR}}" }
      - task: _branch-and-mr
        vars: { DESC: "{{.DESC}}", REPO_NAME: "community-edition", REPO_DIR: "{{.REPO_CE_DIR}}" }
      - task: _setup-session-workspace
        vars: { DESC: "{{.DESC}}" }
      - task: _update-dev-stack
        vars: { DESC: "{{.DESC}}" }
      - echo ""
      - echo "=== Session '{{.DESC}}' created ==="
      - echo "Worktrees at {{.SESSION_DIR}}/{{.DESC}}/"
      - ls -1 "{{.SESSION_DIR}}/{{.DESC}}/" | grep -v '^\.'
      - echo ""
      - echo "Branch mapping:"
      - cat "{{.SESSION_DIR}}/{{.DESC}}/.branches"

  # ===========================================================================
  # session:dev — iterate the dev version in all repos
  # ===========================================================================
  dev:
    desc: "Iterate dev version: task session:dev -- <description> [repo ...]"
    requires:
      vars: [CLI_ARGS]
    vars:
      # CLI_ARGS is "<description> [repo ...]". The first token is the
      # session description; any remaining tokens form an optional repo
      # allow-list. When the list is empty, ALL repos are bumped (the
      # original behaviour).
      DESC:
        sh: echo "{{.CLI_ARGS}}" | awk '{print $1}'
      REPOS:
        sh: echo "{{.CLI_ARGS}}" | cut -s -d' ' -f2-
    preconditions:
      - sh: '[ -n "{{.DESC}}" ]'
        msg: "Usage: task session:dev -- <description> [repo ...]"
      - sh: '[ -f "{{.SESSION_DIR}}/{{.DESC}}/.branches" ]'
        msg: "Session '{{.DESC}}' not found — run session:new first"
    cmds:
      - |
        if [ -n "{{.REPOS}}" ]; then
          echo "=== Dev iteration for: {{.REPOS}} ==="
        else
          echo "=== Dev iteration for: ALL repos ==="
        fi
      - task: _bump-dev
        vars: { DESC: "{{.DESC}}", REPOS: "{{.REPOS}}", REPO_NAME: "metahub-api", REPO_DIR: "{{.REPO_API_DIR}}" }
      - task: _bump-dev
        vars: { DESC: "{{.DESC}}", REPOS: "{{.REPOS}}", REPO_NAME: "metalib", REPO_DIR: "{{.REPO_LIB_DIR}}" }
      - task: _bump-dev
        vars: { DESC: "{{.DESC}}", REPOS: "{{.REPOS}}", REPO_NAME: "metahub-admin", REPO_DIR: "{{.REPO_ADMIN_DIR}}" }
      - task: _bump-dev
        vars: { DESC: "{{.DESC}}", REPOS: "{{.REPOS}}", REPO_NAME: "metahub-ui", REPO_DIR: "{{.REPO_UI_DIR}}" }
      - task: _bump-dev
        vars: { DESC: "{{.DESC}}", REPOS: "{{.REPOS}}", REPO_NAME: "community-edition", REPO_DIR: "{{.REPO_CE_DIR}}" }
      - echo ""
      - echo "=== Dev iteration complete ==="

  # ===========================================================================
  # session:finish — finalize the session across all repos
  #
  # Per repo that has changes beyond the initial dev bump:
  #   1. Archive OpenSpec changes (if any .openspec/ dir exists)
  #   2. Run the full test suite
  #   3. Submit SonarQube analysis
  #   4. Push the branch
  #   5. Update the MR description with a summary
  #
  # Repos with no changes are reported as "unchanged".
  # The human decides per-repo: version:<repo>:<level> or close:<repo>.
  # ===========================================================================
  finish:
    desc: "Finalize session: task session:finish -- <description>"
    requires:
      vars: [CLI_ARGS]
    vars:
      DESC: "{{.CLI_ARGS}}"
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: "Usage: task session:finish -- <description>"
      - sh: '[ -f "{{.SESSION_DIR}}/{{.CLI_ARGS}}/.branches" ]'
        msg: "Session '{{.CLI_ARGS}}' not found"
    cmds:
      - task: _finalize-repo
        vars: { DESC: "{{.DESC}}", REPO_NAME: "metahub-api", REPO_DIR: "{{.REPO_API_DIR}}" }
      - task: _finalize-repo
        vars: { DESC: "{{.DESC}}", REPO_NAME: "metalib", REPO_DIR: "{{.REPO_LIB_DIR}}" }
      - task: _finalize-repo
        vars: { DESC: "{{.DESC}}", REPO_NAME: "metahub-admin", REPO_DIR: "{{.REPO_ADMIN_DIR}}" }
      - task: _finalize-repo
        vars: { DESC: "{{.DESC}}", REPO_NAME: "metahub-ui", REPO_DIR: "{{.REPO_UI_DIR}}" }
      - task: _finalize-repo
        vars: { DESC: "{{.DESC}}", REPO_NAME: "community-edition", REPO_DIR: "{{.REPO_CE_DIR}}" }
      # Write session-level CONTEXT.md to Obsidian if it exists in the session dir
      - |
        set -e
        S="$(pwd)/{{.SESSION_DIR}}/{{.DESC}}"
        DESC="{{.DESC}}"
        if [ -f "${S}/CONTEXT.md" ]; then
          echo "[session] CONTEXT.md found — will be available for next session"
        else
          echo "[session] NOTE: No CONTEXT.md in session root."
          echo "[session] The agent should write one before finishing to help the next session."
        fi
      - |
        echo ""
        echo "=== Session '{{.DESC}}' finalized ==="
        echo ""
        echo "Next steps per repo:"
        echo "  Changed repos:   task session:version:REPO:LEVEL -- {{.DESC}}"
        echo "  Unchanged repos: task session:close:REPO -- {{.DESC}}"
        echo ""
        echo "Status:"
        grep '\.status=' "{{.SESSION_DIR}}/{{.DESC}}/.branches" 2>/dev/null | sed 's/^/  /' || echo "  (no status yet)"

  # ===========================================================================
  # session:version:<repo>:<level> — set the release version for a single repo
  # ===========================================================================
  version:*:*:
    desc: "Set release version: task session:version:<repo>:<major|minor|patch> -- <description>"
    requires:
      vars: [CLI_ARGS]
    vars:
      REPO_NAME: '{{index .MATCH 0}}'
      LEVEL: '{{index .MATCH 1}}'
      DESC: "{{.CLI_ARGS}}"
      REPO_DIR:
        sh: |
          case "{{index .MATCH 0}}" in
            metahub-api)       eval echo "{{.REPO_API_DIR}}" ;;
            metalib)           eval echo "{{.REPO_LIB_DIR}}" ;;
            metahub-admin)     eval echo "{{.REPO_ADMIN_DIR}}" ;;
            metahub-ui)        eval echo "{{.REPO_UI_DIR}}" ;;
            community-edition) eval echo "{{.REPO_CE_DIR}}" ;;
            *) echo "" ;;
          esac
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: "Usage: task session:version:<repo>:<level> -- <description>"
      - sh: 'echo "{{.LEVEL}}" | grep -qE "^(major|minor|patch)$"'
        msg: "Level must be one of: major, minor, patch (got '{{.LEVEL}}')"
      - sh: '[ -f "{{.SESSION_DIR}}/{{.CLI_ARGS}}/.branches" ]'
        msg: "Session '{{.CLI_ARGS}}' not found"
      - sh: 'grep -q "^{{.REPO_NAME}}=" "{{.SESSION_DIR}}/{{.CLI_ARGS}}/.branches"'
        msg: "Repo '{{.REPO_NAME}}' not found in session '{{.CLI_ARGS}}'"
      - sh: '[ -n "{{.REPO_DIR}}" ]'
        msg: "Unknown repo '{{.REPO_NAME}}'. Must be one of: metahub-api, metalib, metahub-admin, metahub-ui, community-edition"
    cmds:
      - task: _version-repo
        vars:
          DESC: "{{.DESC}}"
          REPO_NAME: "{{.REPO_NAME}}"
          REPO_DIR: "{{.REPO_DIR}}"
          LEVEL: "{{.LEVEL}}"

  # ===========================================================================
  # session:close:<repo> — close MR for a repo with no changes
  # ===========================================================================
  close:*:
    desc: "Close MR (no changes): task session:close:<repo> -- <description>"
    requires:
      vars: [CLI_ARGS]
    vars:
      REPO_NAME: '{{index .MATCH 0}}'
      DESC: "{{.CLI_ARGS}}"
      REPO_DIR:
        sh: |
          case "{{index .MATCH 0}}" in
            metahub-api)       eval echo "{{.REPO_API_DIR}}" ;;
            metalib)           eval echo "{{.REPO_LIB_DIR}}" ;;
            metahub-admin)     eval echo "{{.REPO_ADMIN_DIR}}" ;;
            metahub-ui)        eval echo "{{.REPO_UI_DIR}}" ;;
            community-edition) eval echo "{{.REPO_CE_DIR}}" ;;
            *) echo "" ;;
          esac
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: "Usage: task session:close:<repo> -- <description>"
      - sh: '[ -f "{{.SESSION_DIR}}/{{.CLI_ARGS}}/.branches" ]'
        msg: "Session '{{.CLI_ARGS}}' not found"
      - sh: 'grep -q "^{{.REPO_NAME}}=" "{{.SESSION_DIR}}/{{.CLI_ARGS}}/.branches"'
        msg: "Repo '{{.REPO_NAME}}' not found in session '{{.CLI_ARGS}}'"
    cmds:
      - |
        set -e
        DESC="{{.DESC}}"
        REPO_NAME="{{.REPO_NAME}}"
        BRANCH=$(grep "^${REPO_NAME}=" "{{.SESSION_DIR}}/${DESC}/.branches" | cut -d= -f2)
        WT_PATH="$(pwd)/{{.SESSION_DIR}}/${DESC}/${REPO_NAME}"
        BRANCHES_FILE="$(pwd)/{{.SESSION_DIR}}/${DESC}/.branches"

        echo ""
        echo "=== [${REPO_NAME}] Closing MR (no changes) ==="

        cd "${WT_PATH}" 2>/dev/null || cd "{{.REPO_DIR}}"
        glab mr close "${BRANCH}" 2>&1 || echo "[${REPO_NAME}] WARNING: Could not close MR"
        echo "[${REPO_NAME}] MR closed"

        echo "${REPO_NAME}.status=closed" >> "${BRANCHES_FILE}"

  # ===========================================================================
  # session:suspend — remove worktrees, keep branches
  # ===========================================================================
  suspend:
    desc: "Suspend a session: task session:suspend -- <description>"
    requires:
      vars: [CLI_ARGS]
    vars:
      DESC: "{{.CLI_ARGS}}"
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: "Usage: task session:suspend -- <description>"
      - sh: '[ -d "{{.SESSION_DIR}}/{{.CLI_ARGS}}" ]'
        msg: "Session directory '{{.SESSION_DIR}}/{{.CLI_ARGS}}' does not exist"
    cmds:
      - task: _worktree-rm
        vars: { DESC: "{{.DESC}}", REPO_NAME: "metahub-api", REPO_DIR: "{{.REPO_API_DIR}}" }
      - task: _worktree-rm
        vars: { DESC: "{{.DESC}}", REPO_NAME: "metalib", REPO_DIR: "{{.REPO_LIB_DIR}}" }
      - task: _worktree-rm
        vars: { DESC: "{{.DESC}}", REPO_NAME: "metahub-admin", REPO_DIR: "{{.REPO_ADMIN_DIR}}" }
      - task: _worktree-rm
        vars: { DESC: "{{.DESC}}", REPO_NAME: "metahub-ui", REPO_DIR: "{{.REPO_UI_DIR}}" }
      - task: _worktree-rm
        vars: { DESC: "{{.DESC}}", REPO_NAME: "community-edition", REPO_DIR: "{{.REPO_CE_DIR}}" }
      - echo ""
      - echo "=== Session '{{.DESC}}' suspended ==="
      - 'echo "Resume with: task session:resume -- {{.DESC}}"'

  # ===========================================================================
  # session:resume — recreate worktrees from branches
  # ===========================================================================
  resume:
    desc: "Resume a session: task session:resume -- <description>"
    requires:
      vars: [CLI_ARGS]
    vars:
      DESC: "{{.CLI_ARGS}}"
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: "Usage: task session:resume -- <description>"
      - sh: '[ -f "{{.SESSION_DIR}}/{{.CLI_ARGS}}/.branches" ]'
        msg: "No branch metadata found at '{{.SESSION_DIR}}/{{.CLI_ARGS}}/.branches'"
    cmds:
      - task: _worktree-resume
        vars: { DESC: "{{.DESC}}", REPO_NAME: "metahub-api", REPO_DIR: "{{.REPO_API_DIR}}" }
      - task: _worktree-resume
        vars: { DESC: "{{.DESC}}", REPO_NAME: "metalib", REPO_DIR: "{{.REPO_LIB_DIR}}" }
      - task: _worktree-resume
        vars: { DESC: "{{.DESC}}", REPO_NAME: "metahub-admin", REPO_DIR: "{{.REPO_ADMIN_DIR}}" }
      - task: _worktree-resume
        vars: { DESC: "{{.DESC}}", REPO_NAME: "metahub-ui", REPO_DIR: "{{.REPO_UI_DIR}}" }
      - task: _worktree-resume
        vars: { DESC: "{{.DESC}}", REPO_NAME: "community-edition", REPO_DIR: "{{.REPO_CE_DIR}}" }
      - echo ""
      - echo "=== Session '{{.DESC}}' resumed ==="
      - ls -1 "{{.SESSION_DIR}}/{{.DESC}}/" | grep -v '^\.'

  # ===========================================================================
  # session:rm — alias for suspend
  # ===========================================================================
  rm:
    desc: "Remove a session (alias for suspend): task session:rm -- <description>"
    requires:
      vars: [CLI_ARGS]
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: "Usage: task session:rm -- <description>"
      - sh: '[ -d "{{.SESSION_DIR}}/{{.CLI_ARGS}}" ]'
        msg: "Session directory '{{.SESSION_DIR}}/{{.CLI_ARGS}}' does not exist"
    cmds:
      - task: suspend

  # ===========================================================================
  # session:list — show active sessions
  # ===========================================================================
  list:
    desc: "List active sessions"
    cmds:
      - |
        if [ -d "{{.SESSION_DIR}}" ] && [ "$(ls -A "{{.SESSION_DIR}}" 2>/dev/null)" ]; then
          for s in "{{.SESSION_DIR}}"/*/; do
            name=$(basename "$s")
            if [ -f "$s/.branches" ]; then
              echo "${name}:"
              grep -v '\.' "$s/.branches" | sed 's/^/  /'
              if grep -q '\.' "$s/.branches" 2>/dev/null; then
                echo "  ---"
                grep '\.' "$s/.branches" | sed 's/^/  /'
              fi
            else
              repos=$(ls -1 "$s" 2>/dev/null | grep -v '^\.' | tr '\n' ' ')
              echo "${name}:  ${repos}"
            fi
          done
        else
          echo "No active sessions."
        fi

  # ===========================================================================
  # Internal helpers
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # _branch-and-mr — create branch, worktree, bump dev, push, create draft MR
  # ---------------------------------------------------------------------------
  _branch-and-mr:
    internal: true
    requires:
      vars: [DESC, REPO_NAME, REPO_DIR]
    vars:
      EXPANDED_DIR:
        sh: eval echo "{{.REPO_DIR}}"
      WORKTREE_PATH:
        sh: echo "$(pwd)/{{.SESSION_DIR}}/{{.DESC}}/{{.REPO_NAME}}"
      BRANCH:
        sh: |
          cd "$(eval echo "{{.REPO_DIR}}")"
          NEXT=$(glab mr list -A -P 1 -F json 2>/dev/null \
            | python3 -c "import json,sys; mrs=json.load(sys.stdin); print(mrs[0]['iid']+1 if mrs else 1)" 2>/dev/null \
            || echo "1")
          echo "${NEXT}-{{.DESC}}"
    preconditions:
      - sh: '[ -d "{{.EXPANDED_DIR}}" ]'
        msg: "Source repo '{{.REPO_NAME}}' not found at '{{.REPO_DIR}}'"
      - sh: 'git -C "{{.EXPANDED_DIR}}" rev-parse --git-dir >/dev/null 2>&1'
        msg: "'{{.REPO_DIR}}' is not a git repository"
    cmds:
      - |
        set -e
        REPO_DIR="{{.EXPANDED_DIR}}"
        BRANCH="{{.BRANCH}}"
        REPO_NAME="{{.REPO_NAME}}"
        WT_PATH="{{.WORKTREE_PATH}}"
        BRANCHES_FILE="$(pwd)/{{.SESSION_DIR}}/{{.DESC}}/.branches"

        echo ""
        echo "=== [${REPO_NAME}] Creating branch '${BRANCH}' ==="

        cd "${REPO_DIR}"
        git fetch --quiet origin 2>/dev/null || true

        if git show-ref --verify --quiet "refs/heads/${BRANCH}"; then
          echo "[${REPO_NAME}] Using existing local branch '${BRANCH}'"
          git worktree add "${WT_PATH}" "${BRANCH}"
        elif git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
          echo "[${REPO_NAME}] Tracking remote branch 'origin/${BRANCH}'"
          git worktree add --track -b "${BRANCH}" "${WT_PATH}" "origin/${BRANCH}"
        else
          echo "[${REPO_NAME}] Creating new branch '${BRANCH}' from HEAD"
          git worktree add -b "${BRANCH}" "${WT_PATH}"
        fi

        # Bump to -dev1 (keeps base version, adds dev marker)
        cd "${WT_PATH}"
        if [ -f .bumpversion.cfg ]; then
          echo "[${REPO_NAME}] Bumping to dev1..."
          bump2version --allow-dirty --no-commit --no-tag dev
          NEW_VER=$(grep "current_version" .bumpversion.cfg | head -1 | cut -d= -f2 | tr -d ' ')
          echo "[${REPO_NAME}] Version: ${NEW_VER}"
          git add -A
          git commit -m "Start dev: ${NEW_VER}"
        fi

        echo "[${REPO_NAME}] Pushing '${BRANCH}' to origin..."
        git push -u origin "${BRANCH}"

        echo "[${REPO_NAME}] Creating draft MR..."
        glab mr create \
          --source-branch "${BRANCH}" \
          --target-branch main \
          --title "Draft: {{.DESC}}" \
          --description "Session: {{.DESC}}" \
          --draft \
          --no-editor \
          2>&1 || echo "[${REPO_NAME}] WARNING: MR creation failed (may already exist)"

        echo "${REPO_NAME}=${BRANCH}" >> "${BRANCHES_FILE}"

  # ---------------------------------------------------------------------------
  # _setup-session-workspace — generate opencode config, AGENTS.md, Taskfile
  # ---------------------------------------------------------------------------
  _setup-session-workspace:
    internal: true
    requires:
      vars: [DESC]
    vars:
      SESSION_PATH:
        sh: echo "$(pwd)/{{.SESSION_DIR}}/{{.DESC}}"
      API_ROOT:
        sh: pwd
      LIB_OPENCODE:
        sh: eval echo "{{.REPO_LIB_DIR}}/.opencode"
      API_OPENCODE:
        sh: echo "$(pwd)/.opencode"
    cmds:
      - |
        "{{.API_ROOT}}/misc/bin/setup-session-workspace.sh" \
          "{{.SESSION_PATH}}" \
          "{{.DESC}}" \
          "{{.API_ROOT}}" \
          "{{.LIB_OPENCODE}}" \
          "{{.API_OPENCODE}}"

  # ---------------------------------------------------------------------------
  # _bump-dev — iterate dev version in a single repo worktree
  # ---------------------------------------------------------------------------
  _bump-dev:
    internal: true
    requires:
      vars: [DESC, REPO_NAME, REPO_DIR]
    vars:
      # REPOS is an optional space-separated allow-list. Empty = all repos.
      REPOS: '{{.REPOS | default ""}}'
      WORKTREE_PATH:
        sh: echo "$(pwd)/{{.SESSION_DIR}}/{{.DESC}}/{{.REPO_NAME}}"
    cmds:
      - |
        set -e
        REPO_NAME="{{.REPO_NAME}}"
        WT_PATH="{{.WORKTREE_PATH}}"
        BRANCHES_FILE="$(pwd)/{{.SESSION_DIR}}/{{.DESC}}/.branches"

        # Repo allow-list: when REPOS is non-empty, only bump repos that
        # appear in it. Whitespace-delimited exact match.
        REPOS="{{.REPOS}}"
        if [ -n "${REPOS}" ]; then
          MATCHED=0
          for r in ${REPOS}; do
            if [ "${r}" = "${REPO_NAME}" ]; then
              MATCHED=1
              break
            fi
          done
          if [ "${MATCHED}" -eq 0 ]; then
            echo "[${REPO_NAME}] Not in repo list '${REPOS}' — skipping dev bump"
            exit 0
          fi
        fi

        # Skip repos that are already closed or versioned
        LAST_STATUS=$(grep "^${REPO_NAME}\.status=" "${BRANCHES_FILE}" 2>/dev/null | tail -1 | cut -d= -f2)
        if [ "${LAST_STATUS}" = "closed" ] || [ "${LAST_STATUS}" = "versioned" ]; then
          echo "[${REPO_NAME}] Status is '${LAST_STATUS}' — skipping dev bump"
          exit 0
        fi

        if [ ! -d "${WT_PATH}" ]; then
          echo "[${REPO_NAME}] Worktree not found — skipping (suspended?)"
          exit 0
        fi

        cd "${WT_PATH}"
        if [ -f .bumpversion.cfg ]; then
          bump2version --allow-dirty --no-commit --no-tag dev
          NEW_VER=$(grep "current_version" .bumpversion.cfg | head -1 | cut -d= -f2 | tr -d ' ')
          echo "[${REPO_NAME}] → ${NEW_VER}"
          git add -A
          git commit -m "Dev iteration: ${NEW_VER}"
          git push
        else
          echo "[${REPO_NAME}] No .bumpversion.cfg — skipping"
        fi

  # ---------------------------------------------------------------------------
  # _finalize-repo — archive changes, test, sonar, push, comment on MR
  #
  # Detects whether the repo has changes beyond the initial dev bump.
  # If no real changes: marks as unchanged, skips tests.
  # If changes exist: runs full checklist, pushes, comments on MR.
  # ---------------------------------------------------------------------------
  _finalize-repo:
    internal: true
    requires:
      vars: [DESC, REPO_NAME, REPO_DIR]
    vars:
      WORKTREE_PATH:
        sh: echo "$(pwd)/{{.SESSION_DIR}}/{{.DESC}}/{{.REPO_NAME}}"
      BRANCH:
        sh: grep "^{{.REPO_NAME}}=" "{{.SESSION_DIR}}/{{.DESC}}/.branches" 2>/dev/null | cut -d= -f2
    cmds:
      - |
        set -e
        REPO_NAME="{{.REPO_NAME}}"
        WT_PATH="{{.WORKTREE_PATH}}"
        BRANCH="{{.BRANCH}}"
        DESC="{{.DESC}}"
        BRANCHES_FILE="$(pwd)/{{.SESSION_DIR}}/${DESC}/.branches"

        # Skip repos that are already closed, versioned, or finalized
        LAST_STATUS=$(grep "^${REPO_NAME}\.status=" "${BRANCHES_FILE}" 2>/dev/null | tail -1 | cut -d= -f2)
        if [ "${LAST_STATUS}" = "closed" ]; then
          echo "[${REPO_NAME}] Already closed — skipping"
          exit 0
        fi
        if [ "${LAST_STATUS}" = "versioned" ]; then
          echo "[${REPO_NAME}] Already versioned — skipping"
          exit 0
        fi

        if [ ! -d "${WT_PATH}" ]; then
          echo "[${REPO_NAME}] Worktree not found — skipping (suspended or closed?)"
          exit 0
        fi

        cd "${WT_PATH}"

        echo ""
        echo "=== [${REPO_NAME}] Finalizing ==="

        # Count commits beyond main (excluding the dev bump commits)
        COMMIT_COUNT=$(git rev-list --count main..HEAD 2>/dev/null || echo "0")
        # The initial dev bump is 1 commit; anything more means real work
        # Also count dev iteration commits (grep for "Dev iteration:" and "Start dev:")
        INFRA_COMMITS=$(git log main..HEAD --oneline 2>/dev/null | grep -cE "^[0-9a-f]+ (Start dev:|Dev iteration:)" || echo "0")
        REAL_COMMITS=$((COMMIT_COUNT - INFRA_COMMITS))

        if [ "${REAL_COMMITS}" -le 0 ]; then
          echo "[${REPO_NAME}] No changes beyond dev bumps — unchanged"
          echo "${REPO_NAME}.status=unchanged" >> "${BRANCHES_FILE}"
          return
        fi

        echo "[${REPO_NAME}] ${REAL_COMMITS} change commit(s) found"

        # Commit CONTEXT.md if the agent wrote one
        if [ -f CONTEXT.md ] && ! git diff --quiet CONTEXT.md 2>/dev/null; then
          echo "[${REPO_NAME}] Committing CONTEXT.md"
          git add CONTEXT.md
          git commit -m "Update CONTEXT.md for session ${DESC}"
        elif [ -f CONTEXT.md ] && ! git ls-files --error-unmatch CONTEXT.md >/dev/null 2>&1; then
          echo "[${REPO_NAME}] Committing new CONTEXT.md"
          git add CONTEXT.md
          git commit -m "Add CONTEXT.md for session ${DESC}"
        fi

        # Archive OpenSpec changes if present
        if [ -d .openspec/changes ]; then
          for change_dir in .openspec/changes/*/; do
            [ -d "$change_dir" ] || continue
            change_name=$(basename "$change_dir")
            if [ -f "$change_dir/tasks.md" ] && ! [ -d ".openspec/archive/$change_name" ]; then
              echo "[${REPO_NAME}] Archiving OpenSpec change: ${change_name}"
              mkdir -p ".openspec/archive"
              mv "$change_dir" ".openspec/archive/${change_name}"
              git add -A
              git commit -m "Archive OpenSpec change: ${change_name}"
            fi
          done
        fi

        # Run tests
        echo "[${REPO_NAME}] Running tests..."
        if [ -f ./test.sh ]; then
          ./test.sh 2>&1 > test.log || true
          tail -5 test.log
          echo ""
        else
          echo "[${REPO_NAME}] No test.sh — skipping tests"
        fi

        # Run SonarQube analysis
        echo "[${REPO_NAME}] Running SonarQube analysis..."
        if [ -f .env ] && [ -f ./misc/bin/sonar.sh ]; then
          source .env 2>/dev/null || true
          ./misc/bin/sonar.sh 2>&1 || echo "[${REPO_NAME}] WARNING: SonarQube analysis failed"
        else
          echo "[${REPO_NAME}] No sonar setup — skipping"
        fi

        # Push
        echo "[${REPO_NAME}] Pushing..."
        git push

        # Build MR comment with commit summary
        COMMIT_SUMMARY=$(git log main..HEAD --oneline --no-decorate 2>/dev/null \
          | grep -vE "^[0-9a-f]+ (Start dev:|Dev iteration:)" \
          | head -20 \
          | sed 's/^/- /')
        CURRENT_VER=$(grep "current_version" .bumpversion.cfg 2>/dev/null | head -1 | cut -d= -f2 | tr -d ' ')

        MR_COMMENT=$(cat <<EOF
        ## Session finalized: ${DESC}

        **Current version:** ${CURRENT_VER}
        **Commits:** ${REAL_COMMITS}

        ### Changes
        ${COMMIT_SUMMARY}

        ---
        *Awaiting version decision and human review.*
        EOF
        )

        echo "[${REPO_NAME}] Adding MR comment..."
        glab mr note "${BRANCH}" -m "${MR_COMMENT}" 2>&1 \
          || echo "[${REPO_NAME}] WARNING: Could not add MR comment"

        echo "${REPO_NAME}.status=finalized" >> "${BRANCHES_FILE}"
        echo "[${REPO_NAME}] Finalized (${REAL_COMMITS} commits)"

  # ---------------------------------------------------------------------------
  # _version-repo — bump a single repo to its release version
  # ---------------------------------------------------------------------------
  _version-repo:
    internal: true
    requires:
      vars: [DESC, REPO_NAME, REPO_DIR, LEVEL]
    vars:
      WORKTREE_PATH:
        sh: echo "$(pwd)/{{.SESSION_DIR}}/{{.DESC}}/{{.REPO_NAME}}"
      BRANCH:
        sh: grep "^{{.REPO_NAME}}=" "{{.SESSION_DIR}}/{{.DESC}}/.branches" 2>/dev/null | cut -d= -f2
      CURRENT_VERSION:
        sh: |
          WT="$(pwd)/{{.SESSION_DIR}}/{{.DESC}}/{{.REPO_NAME}}"
          grep "current_version" "${WT}/.bumpversion.cfg" 2>/dev/null | head -1 | cut -d= -f2 | tr -d ' '
      TARGET_VERSION:
        sh: |
          WT="$(pwd)/{{.SESSION_DIR}}/{{.DESC}}/{{.REPO_NAME}}"
          CURRENT=$(grep "current_version" "${WT}/.bumpversion.cfg" 2>/dev/null | head -1 | cut -d= -f2 | tr -d ' ')
          if [ -z "${CURRENT}" ]; then echo "0.0.0"; exit 0; fi
          BASE="${CURRENT%%-dev*}"
          IFS='.' read -r major minor patch <<< "$BASE"
          case "{{.LEVEL}}" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
          esac
          echo "${major}.${minor}.${patch}"
    cmds:
      - |
        set -e
        REPO_NAME="{{.REPO_NAME}}"
        WT_PATH="{{.WORKTREE_PATH}}"
        LEVEL="{{.LEVEL}}"
        CURRENT="{{.CURRENT_VERSION}}"
        TARGET="{{.TARGET_VERSION}}"
        BRANCH="{{.BRANCH}}"
        DESC="{{.DESC}}"
        BRANCHES_FILE="$(pwd)/{{.SESSION_DIR}}/${DESC}/.branches"

        # Guard: skip if repo is closed
        LAST_STATUS=$(grep "^${REPO_NAME}\.status=" "${BRANCHES_FILE}" 2>/dev/null | tail -1 | cut -d= -f2)
        if [ "${LAST_STATUS}" = "closed" ]; then
          echo "[${REPO_NAME}] Closed — cannot version"
          exit 1
        fi

        if [ ! -d "${WT_PATH}" ]; then
          echo "[${REPO_NAME}] ERROR: Worktree not found at ${WT_PATH}"
          exit 1
        fi

        echo ""
        echo "=== [${REPO_NAME}] Version: ${CURRENT} → ${TARGET} (${LEVEL}) ==="

        cd "${WT_PATH}"

        # Bump to clean release version — let bump2version create the commit and tag
        bump2version --allow-dirty --new-version "${TARGET}" "${LEVEL}"
        echo "[${REPO_NAME}] Version set to ${TARGET} (committed + tagged v${TARGET})"
        git push
        git push origin "v${TARGET}"

        # Mark MR as ready
        echo "[${REPO_NAME}] Marking MR as ready..."
        glab mr update "${BRANCH}" --draft=false 2>&1 \
          || echo "[${REPO_NAME}] WARNING: Could not update MR draft status"

        # Update MR title to include version
        glab mr update "${BRANCH}" --title "${DESC} (${TARGET})" 2>&1 \
          || echo "[${REPO_NAME}] WARNING: Could not update MR title"

        echo "${REPO_NAME}.status=versioned" >> "${BRANCHES_FILE}"
        echo "${REPO_NAME}.version=${TARGET}" >> "${BRANCHES_FILE}"

        echo "[${REPO_NAME}] Ready for review: ${TARGET}"

  # ---------------------------------------------------------------------------
  # _update-dev-stack — update dev-stack Taskfile with new branches
  # ---------------------------------------------------------------------------
  _update-dev-stack:
    internal: true
    requires:
      vars: [DESC]
    vars:
      DEV_STACK_EXPANDED:
        sh: eval echo "{{.DEV_STACK_DIR}}"
      API_BRANCH:
        sh: grep "^metahub-api=" "{{.SESSION_DIR}}/{{.DESC}}/.branches" | cut -d= -f2
      LIB_BRANCH:
        sh: grep "^metalib=" "{{.SESSION_DIR}}/{{.DESC}}/.branches" | cut -d= -f2
      ADMIN_BRANCH:
        sh: grep "^metahub-admin=" "{{.SESSION_DIR}}/{{.DESC}}/.branches" | cut -d= -f2
      UI_BRANCH:
        sh: grep "^metahub-ui=" "{{.SESSION_DIR}}/{{.DESC}}/.branches" | cut -d= -f2
      CE_BRANCH:
        sh: grep "^community-edition=" "{{.SESSION_DIR}}/{{.DESC}}/.branches" | cut -d= -f2
    preconditions:
      - sh: '[ -d "{{.DEV_STACK_EXPANDED}}" ]'
        msg: "Dev-stack directory not found at {{.DEV_STACK_DIR}}"
      - sh: '[ -f "{{.DEV_STACK_EXPANDED}}/Taskfile.yml" ]'
        msg: "Dev-stack Taskfile.yml not found"
    cmds:
      - |
        set -e
        DEV_STACK="{{.DEV_STACK_EXPANDED}}"
        API="{{.API_BRANCH}}"
        LIB="{{.LIB_BRANCH}}"
        ADMIN="{{.ADMIN_BRANCH}}"
        UI="{{.UI_BRANCH}}"
        CE="{{.CE_BRANCH}}"
        DESC="{{.DESC}}"

        echo ""
        echo "=== Updating dev-stack Taskfile ==="
        echo "  API:   ${API}"
        echo "  LIB:   ${LIB}"
        echo "  ADMIN: ${ADMIN}"
        echo "  CE:    ${CE}"
        echo "  UI:    ${UI}"

        cd "${DEV_STACK}"

        # render slots: API:LIB:ADMIN:CE:OCI:UI
        NEW_LINE="      - task: render:${API}:${LIB}:${ADMIN}:${CE}:dev:${UI}"
        awk -v new="${NEW_LINE}" '
          /- task: render:/ && !/\{\{/ { print new; next }
          { print }
        ' Taskfile.yml > Taskfile.yml.tmp && mv Taskfile.yml.tmp Taskfile.yml

        echo "[dev-stack] Updated Taskfile.yml"

        git add Taskfile.yml
        git commit -m "start new session ${DESC}" || echo "[dev-stack] Nothing to commit"
        git push || echo "[dev-stack] Push failed — push manually"

        echo "[dev-stack] Committed and pushed"

  # ---------------------------------------------------------------------------
  # _worktree-rm — remove a single worktree
  # ---------------------------------------------------------------------------
  _worktree-rm:
    internal: true
    requires:
      vars: [DESC, REPO_NAME, REPO_DIR]
    vars:
      EXPANDED_DIR:
        sh: eval echo "{{.REPO_DIR}}"
      WORKTREE_PATH:
        sh: echo "$(pwd)/{{.SESSION_DIR}}/{{.DESC}}/{{.REPO_NAME}}"
    cmds:
      - |
        REPO_DIR="{{.EXPANDED_DIR}}"
        if [ ! -d "${REPO_DIR}" ]; then
          echo "[{{.REPO_NAME}}] Source repo not found — skipping"
          exit 0
        fi
        cd "${REPO_DIR}"
        if git worktree list | grep -q "{{.WORKTREE_PATH}}"; then
          echo "[{{.REPO_NAME}}] Removing worktree"
          git worktree remove "{{.WORKTREE_PATH}}" --force 2>/dev/null || true
        else
          echo "[{{.REPO_NAME}}] No worktree found — skipping"
        fi
        git worktree prune 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # _worktree-resume — recreate worktree from branch in metadata
  # ---------------------------------------------------------------------------
  _worktree-resume:
    internal: true
    requires:
      vars: [DESC, REPO_NAME, REPO_DIR]
    vars:
      EXPANDED_DIR:
        sh: eval echo "{{.REPO_DIR}}"
      BRANCH:
        sh: grep "^{{.REPO_NAME}}=" "{{.SESSION_DIR}}/{{.DESC}}/.branches" 2>/dev/null | cut -d= -f2
      WORKTREE_PATH:
        sh: echo "$(pwd)/{{.SESSION_DIR}}/{{.DESC}}/{{.REPO_NAME}}"
    cmds:
      - |
        set -e
        REPO_NAME="{{.REPO_NAME}}"
        BRANCH="{{.BRANCH}}"
        WT_PATH="{{.WORKTREE_PATH}}"
        BRANCHES_FILE="$(pwd)/{{.SESSION_DIR}}/{{.DESC}}/.branches"

        # Skip closed repos
        LAST_STATUS=$(grep "^${REPO_NAME}\.status=" "${BRANCHES_FILE}" 2>/dev/null | tail -1 | cut -d= -f2)
        if [ "${LAST_STATUS}" = "closed" ]; then
          echo "[${REPO_NAME}] Closed — skipping resume"
          exit 0
        fi

        if [ -z "${BRANCH}" ]; then
          echo "[${REPO_NAME}] No branch found in .branches — skipping"
          exit 0
        fi

        REPO_DIR="{{.EXPANDED_DIR}}"
        if [ ! -d "${REPO_DIR}" ]; then
          echo "[${REPO_NAME}] Source repo not found at {{.REPO_DIR}} — skipping"
          exit 0
        fi

        cd "${REPO_DIR}"
        git fetch --quiet origin 2>/dev/null || true

        if [ -d "${WT_PATH}" ]; then
          echo "[${REPO_NAME}] Worktree already exists — skipping"
          exit 0
        fi

        if git show-ref --verify --quiet "refs/heads/${BRANCH}"; then
          echo "[${REPO_NAME}] Resuming from local branch '${BRANCH}'"
          git worktree add "${WT_PATH}" "${BRANCH}"
        elif git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
          echo "[${REPO_NAME}] Resuming from remote branch 'origin/${BRANCH}'"
          git worktree add --track -b "${BRANCH}" "${WT_PATH}" "origin/${BRANCH}"
        else
          echo "[${REPO_NAME}] ERROR: Branch '${BRANCH}' not found locally or on origin"
          exit 1
        fi
