name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26.x"
  # metahub-core is private until the visibility flip; the job must bypass
  # the public proxy and use the read-only token below.
  GOPRIVATE: "github.com/metahub-registry/*"
  # TRANSITIONAL(private-core): remove after metahub-core is public

jobs:
  build:
    name: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Configure private module access
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          METAHUB_CORE_RO_TOKEN: ${{ secrets.METAHUB_CORE_RO_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${METAHUB_CORE_RO_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: go build ./...

  vet:
    name: vet
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Configure private module access
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          METAHUB_CORE_RO_TOKEN: ${{ secrets.METAHUB_CORE_RO_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${METAHUB_CORE_RO_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: go vet ./...

  lint:
    name: lint
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Configure private module access
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          METAHUB_CORE_RO_TOKEN: ${{ secrets.METAHUB_CORE_RO_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${METAHUB_CORE_RO_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          only-new-issues: true

  test:
    name: test
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Configure private module access
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          METAHUB_CORE_RO_TOKEN: ${{ secrets.METAHUB_CORE_RO_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${METAHUB_CORE_RO_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Unit tests (no containers)
        run: go test -short -timeout 300s ./...

  gitleaks:
    name: gitleaks
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan
        run: '"$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --verbose'

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check Signed-off-by trailers
        env:
          DCO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./.github/scripts/dco.sh

  licenses:
    name: licenses
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Configure private module access
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          METAHUB_CORE_RO_TOKEN: ${{ secrets.METAHUB_CORE_RO_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${METAHUB_CORE_RO_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Check licences
        run: |
          allow="$(grep -vE '^\s*(#|$)' .github/license-allowlist.txt | paste -sd, -)"
          go run github.com/google/go-licenses/v2@v2.0.1 check ./... \
            --allowed_licenses="${allow}" \
            --ignore github.com/multiformats/go-base36
      - name: Regenerate notices
        run: ./.github/scripts/third-party-notices.sh > "${RUNNER_TEMP}/THIRD_PARTY_NOTICES.md"
      - name: Notices are up to date
        run: diff -u THIRD_PARTY_NOTICES.md "${RUNNER_TEMP}/THIRD_PARTY_NOTICES.md"

  vuln:
    name: vuln
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Configure private module access
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          METAHUB_CORE_RO_TOKEN: ${{ secrets.METAHUB_CORE_RO_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${METAHUB_CORE_RO_TOKEN}@github.com/".insteadOf "https://github.com/"
      # Advisory until the dependency refresh lands (see the per-repo change):
      # the current module graph has known advisories in containerd, docker and
      # the OpenTelemetry SDK. The job must not be the reason a PR is red while
      # that debt is being paid; it becomes blocking when the baseline is clear.
      - name: govulncheck
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  telemetry:
    name: telemetry
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Outbound hosts
        run: python3 .github/scripts/check_outbound.py

  hygiene:
    name: workflow hygiene
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull-request workflows must not read secrets
        run: ./misc/bin/check-workflow-secrets.sh

  fast:
    name: fast
    if: always()
    needs: [build, vet, lint, test, gitleaks, hygiene, dco, licenses, vuln, telemetry]
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Fail when any fast job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Fail when a required job did not run
        env:
          ALLOW_SKIPPED: ${{ github.event_name != 'pull_request' && 'dco' || '' }}
          REQUIRED: >-
            build=${{ needs.build.result }}
            vet=${{ needs.vet.result }}
            lint=${{ needs.lint.result }}
            test=${{ needs.test.result }}
            gitleaks=${{ needs.gitleaks.result }}
            hygiene=${{ needs.hygiene.result }}
            licenses=${{ needs.licenses.result }}
            vuln=${{ needs.vuln.result }}
            telemetry=${{ needs.telemetry.result }}
        run: ./misc/bin/check-required-jobs.sh $REQUIRED
