# Triage of the findings reported during the public import (2026-10-22).
#
# Every entry is path-scoped or pattern-scoped, so a new file is still scanned:
# this allowlist records decisions about existing content, it does not disable
# the scan. Re-review when a listed file gains new secrets.
#
#   *_test.go                 fixture tokens and passwords; none is live
#   Taskfile*.yml             `curl -u user:pass` examples against localhost
[extend]
useDefault = true

[allowlist]
regexTarget = 'match'
description = "Triaged fixtures, dev defaults and known false positives"
paths = [
  '''^pkg/api/v1/handlers/[a-z_]+_test\.go$''',
  '''^pkg/api/v1/router/router_test\.go$''',
  '''^pkg/pullthrough/[a-z_]+_test\.go$''',
  '''^Taskfile\.yml$''',
  '''^Taskfile_compose\.yaml$''',
  '''^oauth\.go$''',
  '''^api/v1/handlers/auth\.go$''',
]
regexes = [
  '''"scope":\s+\{"openid profile email groups"\}''',
  '''return "", "", false''',
]
