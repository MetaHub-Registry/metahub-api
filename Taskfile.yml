version: '3'

dotenv: ['.env']

includes:
  dev:
    taskfile: ./Taskfile_dev.yml
  session:
    taskfile: ./Taskfile_session.yml
  e2e:
    taskfile: ./Taskfile_e2e_dev.yml
  mh-ui:
    taskfile: ~/src/gitlab.com/qnib-frontend/metahub-ui/Taskfile.yaml
    dir: ~/src/gitlab.com/qnib-frontend/metahub-ui/
tasks:
  up:*:
    vars:
      UPTYPE: '{{index .MATCH 0}}' 
    cmds:
      - docker-compose -f docker-compose-{{.UPTYPE}}.yaml up -d --wait
  up:
    cmds:
      - docker network create mh-data || true
      - docker volume create ce-registry || true
      - task: up:data
      - task: up:monitoring
      - task: mh-ui:build
      - docker-compose -f docker-compose.yaml up -d --wait
  down:
    cmds:
      - docker-compose stop
      - docker-compose -f docker-compose-monitoring.yaml down -v
      - docker-compose -f docker-compose-data.yaml down -v
  logAPI:
    cmds:
      - docker compose exec -ti -w /Users/christian.kniep/go/src/github.com/metahub-registry/metahub-api dev supervisorctl tail {{ .CLI_ARGS }} metahub
  restartAPI:
    cmds:
      - docker compose exec -ti -w /Users/christian.kniep/go/src/github.com/metahub-registry/metahub-api dev supervisorctl stop metahub
      - docker compose exec -ti -w /Users/christian.kniep/go/src/github.com/metahub-registry/metahub-api dev supervisorctl start metahub
  seedAdmin:
    cmds:
      - docker compose exec -ti -w /etc/metahub-admin admin ./misc/bin/run-local.sh /community-edition/collections/qnib/ftest
  compute:
    cmds:
      - task: compute:manifests
      - task: compute:manifestlists
  compute:*:
    vars:
      ele: '{{index .MATCH 0}}' 
    cmds:
      - docker compose exec -ti -w /etc/metahub-admin admin metahub-admin --config ./misc/config/compose-config.yaml compute {{ .ele }}
  seedMinimal:
    cmds:
      - docker compose exec -ti -w /etc/metahub-admin admin ./misc/bin/parse-profiles-rules.sh {{.CLI_ARGS}}
  loginDind:*:
    vars:
      PROF: '{{index .MATCH 0}}' 
    cmds:
      - docker compose exec -ti dind sh -c "echo oci | docker login dev:80 -u ${GODMODE_USER}/{{.PROF }} --password-stdin"
  loginDind:
    cmds:
      - docker compose exec -ti dind sh -c "echo oci | docker login dev:80 -u ${GODMODE_USER} --password-stdin"
  pushAlpine:*:
    vars:
      ARCH: '{{index .MATCH 0}}' 
    cmds:
      - docker compose exec -ti dind sh -c "docker pull --platform=linux/{{.ARCH}} alpine:latest"
      - docker compose exec -ti dind sh -c "docker tag alpine:latest dev:80/qnib/alpine:latest"
      - docker compose exec -ti dind sh -c "docker push dev:80/qnib/alpine:latest"
  multiAlpine:
    cmds:
      - docker compose exec -ti dind sh -c "docker buildx create --use --name multiarchbuilder"
      - docker compose exec -ti dind sh -c "docker buildx build --platform linux/amd64,linux/arm64 --push -t dev:80/qnib/alpine:multiarchlatest --build-arg BASE_IMAGE=alpine:latest ./misc/dockerfiles/alpine/"
  testDind:
    cmds:
      - docker compose exec -ti dind sh -c "docker pull dev:80/qnib/ftest:latest"
      - docker compose exec -ti dind sh -c "docker run -ti --rm dev:80/qnib/ftest:latest"
  execDind:
    cmds:
      - docker compose exec -ti dind bash
  exec:*:
    vars:
      SERVICE: '{{index .MATCH 0}}' 
    cmds:
      - docker compose exec -ti {{.SERVICE}} bash
  ociBuild:
    cmds:
      - docker compose exec -ti -w /opt/results/distribution-spec/conformance oci go test -c
  ociConformance:
    desc: Run the full OCI conformance suite (push+pull+discovery+management)
    cmds:
      - docker compose exec -ti -e OCI_TEST_PUSH=1 -e OCI_TEST_PULL=1 -e OCI_TEST_CONTENT_DISCOVERY=1 -e OCI_TEST_CONTENT_MANAGEMENT=1 oci /usr/local/src/distribution-spec/conformance/conformance.test
  ociTest:*:*:*:*:
    vars:
      PUSH: '{{index .MATCH 0}}' 
      PULL: '{{index .MATCH 1}}' 
      DISCOVER: '{{index .MATCH 2}}' 
      MANAGEMENT: '{{index .MATCH 3}}'
    cmds:
      - docker compose exec -ti  -e OCI_TEST_PUSH={{.PUSH}} -e OCI_TEST_PULL={{.PULL}} -e OCI_TEST_CONTENT_DISCOVERY={{.DISCOVER}} -e OCI_TEST_CONTENT_MANAGEMENT={{.MANAGEMENT}}  oci /usr/local/src/distribution-spec/conformance/conformance.test
  ociTestDev:*:*:*:*:
    vars:
      PUSH: '{{index .MATCH 0}}' 
      PULL: '{{index .MATCH 1}}' 
      DISCOVER: '{{index .MATCH 2}}' 
      MANAGEMENT: '{{index .MATCH 3}}'
    cmds:
      - docker compose exec -ti -e OCI_TEST_PUSH={{.PUSH}} -e OCI_TEST_PULL={{.PULL}} -e OCI_TEST_CONTENT_DISCOVERY={{.DISCOVER}} -e OCI_TEST_CONTENT_MANAGEMENT={{.MANAGEMENT}} -e OCI_USERNAME=qnib -e OCI_PASSWORD=qnib oci /opt/results/distribution-spec/conformance/conformance.test
  deleteGraph:
    cmds:
      - docker compose exec -ti neo4j cypher-shell -u neo4j -p test "MATCH (n) WHERE (NOT n:Profile) AND (NOT n:Rule) DETACH DELETE n"
  showGraph:
    cmds:
      - docker compose exec -ti neo4j cypher-shell -u neo4j -p test "MATCH (n) RETURN n LIMIT 25"
  mcSetup:
    cmds:
      - mc alias set dev http://localhost:9000 minio miniominio
  mcClean:
    cmds:
      - mc rm --recursive --force dev/blobs
      - mc rm --recursive --force dev/manifests
  # ---------------------------------------------------------------------------
  # E2E Multi-Arch Validation (Path Z)
  # ---------------------------------------------------------------------------
  # Full flow: clean → seed → login → push amd64 → push arm64 → inspect index
  # See Obsidian: Metahub/docs/e2e-multiarch-validation.md
  # ---------------------------------------------------------------------------

  e2e:clean:
    desc: Wipe graph (keep profiles/rules) and MinIO buckets for a clean E2E run
    cmds:
      - docker compose exec neo4j cypher-shell -u neo4j -p test "MATCH (n) WHERE (NOT n:Profile) AND (NOT n:Rule) DETACH DELETE n"
      - mc rm --recursive --force dev/blobs 2>/dev/null || true
      - mc rm --recursive --force dev/manifests 2>/dev/null || true

  e2e:seed:
    desc: Seed minimal profiles and rules needed for multi-arch compute
    cmds:
      - docker compose exec -w /etc/metahub-admin admin ./misc/bin/parse-profiles-rules.sh

  e2e:push:
    desc: Push single-arch alpine images for amd64 and arm64 (server-side aggregation)
    cmds:
      - task: loginDind
      - echo "=== Pushing amd64 ==="
      - docker compose exec dind sh -c "docker pull --platform=linux/amd64 alpine:latest && docker tag alpine:latest dev:80/qnib/alpine:latest && docker push dev:80/qnib/alpine:latest"
      - echo "=== Pushing arm64 ==="
      - docker compose exec dind sh -c "docker pull --platform=linux/arm64 alpine:latest && docker tag alpine:latest dev:80/qnib/alpine:latest && docker push dev:80/qnib/alpine:latest"

  e2e:inspect:
    desc: Inspect the computed multi-arch index via regctl and curl
    cmds:
      - echo "=== regctl manifest get ==="
      - docker compose exec dind sh -c "regctl registry set dev:80 --tls disabled 2>/dev/null; regctl manifest get dev:80/qnib/alpine:latest"
      - echo ""
      - echo "=== Raw OCI Index JSON ==="
      - |
        docker compose exec dind sh -c '
          TOKEN=$(curl -s "http://dev:80/auth?service=dev&scope=repository:qnib/alpine:pull" \
            -u "oci:oci" | jq -r ".token")
          curl -s -H "Authorization: Bearer ${TOKEN}" \
               http://dev:80/v2/qnib/alpine/manifests/latest | jq .
        '

  e2e:verify:
    desc: Verify the index has exactly 2 descriptors (amd64 + arm64)
    cmds:
      - |
        docker compose exec dind sh -c '
          TOKEN=$(curl -s "http://dev:80/auth?service=dev&scope=repository:qnib/alpine:pull" \
            -u "oci:oci" | jq -r ".token")
          RESP=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
                      http://dev:80/v2/qnib/alpine/manifests/latest)
          COUNT=$(echo "$RESP" | jq ".manifests | length")
          ARCHS=$(echo "$RESP" | jq -r "[.manifests[].platform.architecture] | sort | join(\",\")")
          MT=$(echo "$RESP" | jq -r ".mediaType")
          echo "mediaType:    $MT"
          echo "descriptors:  $COUNT"
          echo "architectures: $ARCHS"
          echo ""
          if [ "$COUNT" = "2" ] && [ "$ARCHS" = "amd64,arm64" ]; then
            echo "✅ PASS: Index has 2 descriptors (amd64, arm64)"
          else
            echo "❌ FAIL: Expected 2 descriptors (amd64,arm64), got $COUNT ($ARCHS)"
            exit 1
          fi
        '

  e2e:pull:
    desc: Verify docker pull resolves the correct manifest from the index
    cmds:
      - echo "=== Pulling from multi-arch index ==="
      - docker compose exec dind sh -c "docker pull dev:80/qnib/alpine:latest"
      - echo "=== Verifying pulled image ==="
      - docker compose exec dind sh -c "docker inspect dev:80/qnib/alpine:latest | jq '.[0].Architecture'"

  e2e:graph:
    desc: Show the Slot→Index→ManifestData graph structure
    cmds:
      - echo "=== Slots ==="
      - docker compose exec neo4j cypher-shell -u neo4j -p test "MATCH (s:Slot) RETURN s.repo AS repo, s.tag AS tag, s.profile AS profile, id(s) AS id"
      - echo "=== Slot→Index (POINTS_TO) ==="
      - docker compose exec neo4j cypher-shell -u neo4j -p test "MATCH (s:Slot)-[:POINTS_TO]->(i:Index) RETURN s.repo AS repo, s.tag AS tag, s.profile AS profile, i.digest AS indexDigest"
      - echo "=== Index→ManifestData (REFERENCES) ==="
      - docker compose exec neo4j cypher-shell -u neo4j -p test "MATCH (i:Index)-[r:REFERENCES]->(md:ManifestData)-[:HAS_PLATFORM]->(p:Platform) RETURN i.digest AS indexDigest, md.digest AS manifestDigest, p.arch AS arch, p.os AS os, r.order AS position ORDER BY r.order"

  e2e:multiarch:
    desc: Full multi-arch E2E flow — clean, seed, push, verify, pull
    cmds:
      - task: e2e:clean
      - task: e2e:seed
      - task: restartAPI
      - echo "=== Waiting for API to be ready ==="
      - sleep 5
      - task: e2e:push
      - task: e2e:verify
      - task: e2e:graph
      - task: e2e:pull
      - echo ""
      - echo "=== E2E Multi-Arch Validation Complete ==="

  resetEnv:
    desc: Wipe neo4j graph + MinIO, re-seed profiles/rules, restart API
    cmds:
      - task: deleteGraph
      - task: e2e:clean
      - task: seedMinimal
      - task: restartAPI
      - echo "=== Environment reset complete ==="

  localConfig:
    cmds:
     - gonja-cli misc/config/metahub-api.yaml.tpl misc/config/local-config.yaml