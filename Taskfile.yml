version: '3'

dotenv:
  - .env
  - misc/config/compose.env

includes:
  dev:
    taskfile: ./Taskfile_dev.yml
  compose:
    taskfile: ./Taskfile_compose.yaml
  mh-ui:
    taskfile: ../metahub-ui/Taskfile.yaml
    dir: ../metahub-ui/
    optional: true
tasks:
  localConfig:
    cmds:
     - ': "${MINIO_PASSWD:?set MINIO_PASSWD}"'
     - ': "${NEO4J_PASSWD:?set NEO4J_PASSWD}"'
     - 'if [ -n "${GODMODE_USER:-}" ]; then : "${GODMODE_PASS:?set GODMODE_PASS}"; : "${GODMODE_SIGNING_KEY:?set GODMODE_SIGNING_KEY}"; fi'
     - gonja-cli misc/config/metahub-api.yaml.tpl misc/config/local-config.yaml
