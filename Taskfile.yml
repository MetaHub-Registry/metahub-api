version: '3'

dotenv:
  - .env
  - misc/config/compose.env

includes:
  dev:
    taskfile: ./Taskfile_dev.yml
  compose:
    taskfile: ./Taskfile_compose.yaml
  mh-ui:
    taskfile: ~/src/gitlab.com/qnib-frontend/metahub-ui/Taskfile.yaml
    dir: ~/src/gitlab.com/qnib-frontend/metahub-ui/
    optional: true
tasks:
  localConfig:
    cmds:
     - ': "${MINIO_PASSWD:?set MINIO_PASSWD}"'
     - ': "${NEO4J_PASSWD:?set NEO4J_PASSWD}"'
     - gonja-cli misc/config/metahub-api.yaml.tpl misc/config/local-config.yaml
