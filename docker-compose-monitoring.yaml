version: '3.9'
services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./misc/compose/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - mon-internal
      - mh-data
    ports:
      - 9099:9090
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - '6831:6831'
      - '14268:14268'
      - '16686:16686'
    networks:
      - mon-internal
      - mh-data
  grafana:
    build:
      context: ./misc/compose/grafana
      dockerfile: Dockerfile 
    volumes:
      - ./misc/compose/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./misc/compose/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yaml
    networks:
      - mon-internal
    ports:
      - 3000:3000
  opensearch:
    image: opensearchproject/opensearch:2.2.0
    container_name: opensearch
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch
      - discovery.seed_hosts=opensearch
      - cluster.initial_master_nodes=opensearch
      - bootstrap.memory_lock=true # along with the memlock settings below, disables swapping
      - "OPENSEARCH_JAVA_OPTS=-Xms2048m -Xmx2048m" # minimum and maximum Java heap size, recommend setting both to 50% of system RAM
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536 # maximum number of open files for the OpenSearch user, set to at least 65536 on modern systems
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - mon-internal
    ports:
      - 9200:9200
      - 9600:9600
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.2.0
    container_name: opensearch-dashboards
    networks:
      - mon-internal
    ports:
      - 5601:5601
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]' # must be a string with no spaces when specified as an environment variable
  logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:7.16.2
    container_name: logstash
    configs:
      - source: logstash_config
        target: /usr/share/logstash/config/logstash.yml
        mode: 0444
      - source: grok_patterns
        target: /usr/share/logstash/patterns/grok-patterns
        mode: 0444
      
      - source: logstash_pipeline_metahub
        target: /usr/share/logstash/pipeline/metahub.conf
        mode: 0444
    networks:
      - mon-internal
      - mh-data
    ports:
      - 12201:12201
      - 12201:12201/udp
    
configs:
  logstash_config:
    file: ./misc/compose/logstash/config/logstash.yml
  logstash_pipeline_metahub:
    file: ./misc/compose/logstash/pipelines/metahub.conf
  grok_patterns:
    file: ./misc/compose/logstash/patterns/grok-patterns

networks:
  mon-internal:
  mh-data:
    external: true

volumes:
  opensearch-data:
