# Ensures the metahub OAuth2 providers grant the `goauthentik.io/api` scope so a
# user's access token can call Authentik's core API (self-service registry-token
# management). This captures, as reproducible IaC, a configuration that was
# previously applied manually in the Authentik admin UI / DB.
#
# Idempotent: applying repeatedly converges the provider's selected scope
# mappings to exactly the set listed below.
version: 1
metadata:
  name: metahub - OAuth2 provider scopes
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # --- prod: metahub-api ---
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: metahub-api
    attrs:
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-authentik_api"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "organizations"]]

  # --- dev: metahub-dev (kept at parity) ---
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: metahub-dev
    attrs:
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-authentik_api"]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "organizations"]]
