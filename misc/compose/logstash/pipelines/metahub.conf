input {
  gelf {
      use_udp => true
      port_udp => 12201
      tags => ["gelf"]
   }
}

filter {
  
  if "gelf" in [tags] {
    grok {
      match => { "message" => "time=\".*\" level=%{WORD:level} msg=%{GREEDYDATA:msg}"}
      remove_field => [ "message" ]
      add_field => { "timestamp" => "%{@timestamp}" }

    }
  } else {
    json {
      source => "message"
      remove_field => [ "message", "@timestamp" ]
    }
    mutate {
      add_field => { "timestamp" => "%{date}" }
    }
    grok {
      match => { "log" => "time=\".*\" level=%{WORD:level} msg=%{GREEDYDATA:msg}"}
      remove_field => [ "log" ]
    }
  }
  grok {
    patterns_dir => ["/usr/share/logstash/patterns"]
    match => { "msg" => '%{IP:client_ip}:.*GET %{GREEDYDATA:get_path}"' }
  }
  if [get_path] == "/health" {
    drop {} 
  }
  if [client_ip] {
    geoip {
      source => "client_ip"
    }
  }
  if [middleware] == "logger" {
    grok {
      patterns_dir => ["/usr/share/logstash/patterns"]
      match => { "message" => "%{URIPROTO:uri_proto}://(?:%{USER:user}(?::[^@]*)?@)?(?:%{URIHOST:uri_domain})?(?:%{URIPATHPARAM:uri_param})?" }
    }
    if [uri_param] {
      mutate {
        replace => { "message" => "%{status_code} %{bytes} %{duration_display} %{method} %{uri_param}" }
      }
    }
  }
}

output {
  opensearch {
     hosts => ["https://opensearch:9200"]
     index => "opensearch-logstash-docker-%{+YYYY.MM.dd}"
     user => "admin"
     password => "0dd319bcbbb3A$"
     ssl => true
     ssl_certificate_verification => false
   }
}

