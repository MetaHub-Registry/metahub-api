minio:
  url: minio:9000
  region: us-east-1
  user: minio 
  password: miniominio
  redirect: false
  ssl: false
  manifests:
    bucket: manifests
  blobs:
    bucket: blobs
    redirect: false
neo4j:
  dbname: neo4j
  user: neo4j
  password: test
  url: bolt://neo4j:7687
frontend:
  redirect: http://localhost:8082
logging:
  gelf: logstash:12201
  level: debug
tracing:
  name: "metahub-api"
  endpoint: "http://jaeger:14268/api/traces"
cors:
  enabled: true

godmode:
  signing_key: "a-random-secret-key-at-least-32-characters"
  users:
    - username: oci
      password: oci
      role: admin

# Upstream registries available for pullthrough.
# A client URL metahub-host/<hostname>/<repo>:<tag> triggers pullthrough
# to the configured upstream registry. The registry prefix is preserved
# in the local alias (see pullthrough-repo-handler D5/D6), so these repos
# live in their own namespace region and cannot collide with local pushes.
registries:
  - hostname: zot.example.com
    allow_anon: true
    tls: false

