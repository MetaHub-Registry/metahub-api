# Development configuration for the compose stack.
#
# DO NOT EDIT: this is the template. `misc/bin/gen-compose-config.sh` copies it
# to `compose-config.yaml` and replaces the __TOKENS__ with unique values.
#
#   ./misc/bin/gen-compose-config.sh
#
# The generated file and `compose.env` are ignored by Git.
minio:
  url: minio:9000
  region: us-east-1
  user: __MINIO_ROOT_USER__
  password: __MINIO_ROOT_PASSWORD__
  redirect: false
  ssl: false
  manifests:
    bucket: manifests
  blobs:
    bucket: blobs
    redirect: false
neo4j:
  dbname: neo4j
  user: __NEO4J_USER__
  password: __NEO4J_PASSWORD__
  url: bolt://neo4j:7687
frontend:
  redirect: http://localhost:8082
logging:
  gelf: logstash:12201
  level: debug
tracing:
  name: "metahub-api"
  endpoint: "http://jaeger:14268/api/traces"
cors:
  enabled: true

godmode:
  signing_key: "__GODMODE_SIGNING_KEY__"
  # Multiple accounts with per-account roles. Only the "admin" role may push
  # or delete; "user" accounts are pull-only (enforced by OCIWriteAuthMiddleware).
  users:
    # Conformance / service account — full read+write.
    - username: __ADMIN_USERNAME__
      password: __ADMIN_PASSWORD__
      role: admin
    # Demo account — pull-only.
    - username: __USER_USERNAME__
      password: __USER_PASSWORD__
      role: user

# Upstream registries available for pullthrough.
# A client URL metahub-host/<hostname>/<repo>:<tag> triggers pullthrough
# to the configured upstream registry. The registry prefix is preserved
# in the local alias (see pullthrough-repo-handler D5/D6), so these repos
# live in their own namespace region and cannot collide with local pushes.
registries:
  # Example public upstream for pull-through. Plain HTTP is used here because
  # this local stack has no TLS termination; replace with a registry you trust.
  - name: registry.example.com
    allow_anon: true
    tls: false
    pull_through:
      enabled: true
      client_redirect: false
      cache: async
  # Second upstream example — remove if you only need one.
  - name: mirror.example.com
    allow_anon: true
    tls: false
    pull_through:
      enabled: true
      client_redirect: false
      cache: async
  - name: local-reg
    url: registry:5050
    allow_anon: true
    tls: false
    pull_through:
      enabled: true
      client_redirect: false
      cache: async
